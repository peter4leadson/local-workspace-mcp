name: publish

# Trusted-publishing release workflow for local-workspace-mcp.
#
# Flow: GitHub Release (or manual dispatch) → full verify → `npm stage
# publish` via OIDC → owner approves the staged release on npmjs.com.
#
# - No long-lived npm tokens anywhere. npm authenticates the job by OIDC.
# - Stage-only: the workflow never calls bare `npm publish`; a human with
#   npm 2FA approves the staged version before it goes live.
# - The `npm-release` environment requires owner approval before this job
#   starts (Settings → Environments → npm-release → required reviewers).
# - npm-side: the trusted publisher must be registered on npmjs.com →
#   package Settings → Trusted Publisher (GitHub Actions, repo
#   peter4leadson/local-workspace-mcp, workflow `publish.yml`,
#   environment `npm-release`, action `npm stage publish`). Register it
#   only when a release is imminent — unvalidated registrations expire.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0. Run the workflow on the tagged release commit — package.json version must equal this, and the v<version> tag must point at the checkout SHA."
        required: false
        type: string
      diagnose:
        description: "Run the read-only npm OIDC probe instead of publishing (diagnostics; publishes nothing)."
        required: false
        type: boolean
        default: false
      approve_stage:
        description: "Stage ID to approve via OIDC (from `npm stage list` or the publish log) — approves instead of publishing."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Read-only OIDC handshake probe — temporary diagnostic. Runs only on
  # dispatch with diagnose=true; publishes nothing. Must live in this file
  # and the npm-release environment or the token exchange cannot match the
  # trusted-publisher registration.
  diagnose-oidc:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - name: npm CLI matching the publish job (11.21.0)
        run: npm_config_minimum_release_age=0 npm install -g npm@11.21.0 && npm --version
      - name: Install + build (publish prerequisites)
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Pack the real tarball for the content probe
        run: npm pack --ignore-scripts >/dev/null && ls -la *.tgz
      - name: Probe npm trusted publishing (+ real-bytes WAF bisect)
        run: node .github/scripts/diagnose-npm-oidc.mjs local-workspace-mcp --with-tarball "$(ls *.tgz | head -1)"
      - name: Unmask npm registry errors
        run: node .github/scripts/unmask-registry-errors.mjs
      - name: Stage publish with request headers visible (silly loglevel)
        # Filter out the tarball blob AND any auth/token material the silly
        # loglevel might print — the CLI's exchanged token differs from the
        # probe's masked token.
        run: npm stage publish --access public --tag latest --loglevel silly 2>&1 | grep -viE "_attachments|data\":\"[A-Za-z0-9+/=]{80}|authorization|bearer|npm_[A-Za-z0-9]{8}"
        continue-on-error: true # diagnostic run — capture output, don't gate on it

  # Approve a staged release — dispatch-only. The npm-release environment's
  # required-reviewer approval is still the human gate; this replaces the
  # npmjs.com click with an authorized OIDC call.
  approve-stage:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: npm CLI with staged-publishing support (>=11.15)
        run: npm_config_minimum_release_age=0 npm install -g npm@^11.15.0 && npm --version
      - name: Approve staged release
        run: npm stage approve "${{ inputs.approve_stage }}"

  publish:
    if: github.event_name == 'release' || (!inputs.diagnose && inputs.approve_stage == '')
    runs-on: ubuntu-latest
    environment: npm-release # required-reviewers gate: owner approval before any publish step
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # No fetch-tags: checkout maps the triggered ref itself, so a
          # release/tag-triggered run would fetch refs/tags/v* twice into the
          # same destination ref and git exits 128 ("Cannot fetch both").
          # Tags are fetched explicitly below instead.
      - name: Fetch tags (dispatch runs need them for the consistency check)
        run: git fetch --tags --force
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: npm CLI with OIDC + staged publishing (>=11.15)
        run: |
          # repo .npmrc sets minimum-release-age; bypass it for the tool install itself
          npm_config_minimum_release_age=0 npm install -g npm@^11.15.0
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim(); const [a,b]=v.split('.').map(Number); if(a<11||(a===11&&b<15)) { console.error('npm '+v+' < 11.15'); process.exit(1) }"
      - name: Install ripgrep (fs_search_content dependency)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test (unit + adversarial)
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Pack sanity — tarball contains only dist + docs
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          ! grep -qE 'src/|tests/|\.ts$|\.map$' /tmp/pack.txt
      - name: SBOM
        run: node scripts/sbom.mjs > sbom.cdx.json && head -5 sbom.cdx.json
      - name: Version/tag consistency + not already published
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-check.js
        # Implemented + unit-tested in scripts/release-check.js (tests/release-check.test.ts):
        # version match, tag→SHA, fail-closed npm duplicate check, dist-tag
        # derived from the version (prerelease → next, stable → latest).
      - name: Stage publish to npm (OIDC, owner approves on npmjs.com)
        run: npm stage publish --access public --tag "$DIST_TAG"
        # No --provenance flag: npm attaches build provenance automatically
        # when authenticating via OIDC trusted publishing.
