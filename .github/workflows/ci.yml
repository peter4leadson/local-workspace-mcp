name: ci

# Exact-SHA proof: every push and PR rebuilds from source, runs the full
# suite (including the adversarial regression set), typechecks, and audits.
# Local green is not remote proof — this workflow is the remote proof arm.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read # required for actions/checkout on private repos

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install (frozen lockfile, scripts gated by approve-builds)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test (unit + adversarial)
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Pack sanity — tarball contains only dist + docs
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          ! grep -qE 'src/|tests/|\.ts$|\.map$' /tmp/pack.txt
      - name: SBOM
        run: node scripts/sbom.mjs > sbom.cdx.json && head -5 sbom.cdx.json
